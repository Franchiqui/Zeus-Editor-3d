    <!-- Línea diagonal 4 -->
    <path d="M10 130 L130 10 L135 15 L15 135 Z" fill="gray"/>
    <!-- Línea diagonal 5 -->
    <path d="M10 110 L110 10 L115 15 L15 115 Z" fill="gray"/>
    <!-- Línea diagonal 6 -->
    <path d="M10 90 L90 10 L95 15 L15 95 Z" fill="gray"/>
    <!-- Línea diagonal 7 -->
    <path d="M10 70 L70 10 L75 15 L15 75 Z" fill="gray"/>
    <!-- Línea diagonal 8 -->
    <path d="M10 50 L50 10 L55 15 L15 55 Z" fill="gray"/>
    <!-- Línea diagonal 9 -->
    <path d="M10 30 L30 10 L35 15 L15 35 Z" fill="gray"/>
  </g>
</svg>