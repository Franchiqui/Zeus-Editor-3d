<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Grunge: distressed texture with noise/scratches -->
  <defs>
    <filter id="grungeNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 1"/>
        <feFuncG type="table" tableValues="0 1"/>
        <feFuncB type="table" tableValues="0 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <!-- Base dark texture -->
  <rect width="200" height="200" fill="#4a4a4a"/>
  <!-- Grunge overlay -->
  <rect width="200" height="200" fill="#2a2a2a" filter="url(#grungeNoise)" opacity="0.6"/>
  <!-- Scratch lines -->
  <g stroke="#1a1a1a" stroke-width="0.5" opacity="0.7">
    <line x1="10" y1="25" x2="190" y2="30"/>
    <line x1="5" y1="55" x2="195" y2="52"/>
    <line x1="15" y1="85" x2="185" y2="90"/>
    <line x1="8" y1="115" x2="192" y2="112"/>
    <line x1="12" y1="145" x2="188" y2="148"/>
    <line x1="6" y1="175" x2="194" y2="172"/>
  </g>
  <!-- Speckles -->
  <g fill="#1a1a1a" opacity="0.5">
    <circle cx="25" cy="40" r="1.5"/>
    <circle cx="75" cy="65" r="1"/>
    <circle cx="150" cy="35" r="0.8"/>
    <circle cx="45" cy="100" r="1.2"/>
    <circle cx="120" cy="120" r="0.7"/>
    <circle cx="170" cy="80" r="1"/>
    <circle cx="60" cy="155" r="1.3"/>
    <circle cx="140" cy="170" r="0.9"/>
    <circle cx="180" cy="190" r="0.6"/>
    <circle cx="30" cy="180" r="1"/>
  </g>
  <!-- Edge wear -->
  <rect x="0" y="0" width="200" height="3" fill="#1a1a1a" opacity="0.8"/>
  <rect x="0" y="197" width="200" height="3" fill="#1a1a1a" opacity="0.6"/>
  <rect x="0" y="0" width="3" height="200" fill="#1a1a1a" opacity="0.7"/>
  <rect x="197" y="0" width="3" height="200" fill="#1a1a1a" opacity="0.5"/>
</svg>